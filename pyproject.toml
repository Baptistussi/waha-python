[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waha-python"
version = "1.0.0"
description = "Unofficial WhatsApp HTTP API (WAHA) Python Client - Complete implementation of WAHA API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Baptistussi", email = "baptistussi@users.noreply.github.com" },
]
keywords = ["waha", "whatsapp", "http", "api", "client", "async"]
dependencies = [
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["waha_python"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
